        .fdv-app {

        .fdv-tfm-pill.correct-answer { border-color: var(--green); background: var(--green-dim); color: var(--green); }
        .fdv-tfm-pill.wrong-answer { border-color: var(--red); background: var(--red-dim); color: var(--red); }
        /* Matching */

        .fdv-matching-row {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px;
          background: var(--panel-alt);
          border: 1px solid var(--panel-border);
          border-radius: 6px;
          padding: 10px 12px;

          border-radius: 5px;
          padding: 8px 8px;
          font-size: 13px;
        }
        .fdv-matching-select.correct-answer { border-color: var(--green); }
        .fdv-matching-select.wrong-answer { border-color: var(--red); }
        .fdv-matching-solution { width: 100%; font-size: 12px; color: var(--green); }
        .fdv-check-btn {
          margin-top: 18px;
          width: 100%;
          background: var(--panel-border);
          color: var(--text);
          border: none;
          border-radius: 6px;
          padding: 13px;
          font-size: 14px;
          font-weight: 700;
          cursor: pointer;
        }
        .fdv-check-btn.enabled { background: var(--green); color: var(--text); cursor: pointer; }
        .fdv-check-btn:disabled { opacity: 0.5; cursor: default; }
        .fdv-explanation {
          margin-top: 16px;
          padding-top: 14px;
          border-top: 1px solid var(--panel-border);
          font-size: 13px;
          color: var(--text-dim);

        .fdv-next-btn {
          margin-top: 18px;
          width: 100%;
          background: var(--green);
          color: var(--text);
          border: none;
          border-radius: 6px;
          padding: 13px;
          font-size: 14px;
          font-weight: 700;
          cursor: pointer;
        }
        .fdv-next-btn:hover { filter: brightness(1.08); }
        /* Result screen */
        .fdv-result-score {
          font-size: 44px;
          font-weight: 800;
          font-variant-numeric: tabular-nums;

        .fdv-result-sub {
          color: var(--text-dim);
          font-size: 14px;
          margin-bottom: 24px;
        }
        .fdv-result-actions {
          display: flex;

        .fdv-result-btn.warn { background: var(--red); color: #fff; border: none; font-weight: 700; }
              /* Login + form additions */
        .fdv-login-wrap {
          max-width: 380px;
          margin: 60px auto 0;
        }
        .fdv-login-card {
          margin-top: 16px;
        }
        .fdv-label {
          display: block;
          font-size: 12px;
          font-weight: 600;
          color: var(--text-dim);
          margin: 14px 0 5px;
        }
        .fdv-label:first-child { margin-top: 0; }
        .fdv-input {
          width: 100%;
          background: var(--panel-alt);

        .fdv-add-btn {

        .fdv-source-tag { font-size: 11.5px; color: var(--text-dim); margin: -6px 0 12px; }
        .fdv-image-preview-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .fdv-image-preview { max-width: 120px; max-height: 80px; border-radius: 4px; border: 1px solid var(--panel-border); object-fit: contain; background: var(--panel-alt); }
        .fdv-link-btn {
          background: none;
          border: none;
          padding: 4px 0;
          font-size: 12px;
          color: var(--grey-dark);
          text-decoration: underline;
          cursor: pointer;
        }
        .fdv-link-btn:hover { color: var(--text); }
        .fdv-delete-btn { width: 100%; margin-top: 10px; }
        .fdv-trash-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
        .fdv-trash-item {
          background: var(--panel-alt);
          border: 1px solid var(--panel-border);
          border-radius: 6px;
          padding: 12px 14px;
        }
        .fdv-trash-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .fdv-trash-chapter { font-size: 12px; color: var(--text-dim); font-weight: 600; }
        .fdv-trash-prompt { font-size: 14px; margin-bottom: 10px; }
        .fdv-trash-item .fdv-form-actions { margin-top: 0; }
        .fdv-offline-banner {
          background: var(--amber-dim);
          border: 1px solid var(--amber);
          color: var(--text);
          border-radius: 6px;
          padding: 10px 12px;
          font-size: 12.5px;
          line-height: 1.4;
          margin-bottom: 16px;
        }
        .fdv-nav-row { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
        .fdv-nav-row .fdv-next-btn { width: auto; flex: 1; margin-top: 0; }
        .fdv-prev-btn {
          background: var(--panel-alt);

          border-radius: 6px;
          padding: 8px 14px;
          font-size: 13px;
          font-weight: 500;
          color: var(--text-dim);
          cursor: pointer;
        }
        .fdv-prev-btn:hover { border-color: var(--grey); }

</style>
